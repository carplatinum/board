name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: board_db
          POSTGRES_USER: board_user
          POSTGRES_PASSWORD: board_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      POSTGRES_DB: board_db
      POSTGRES_USER: board_user
      POSTGRES_PASSWORD: board_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.base  # Установка переменной среды

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true --local
          poetry config virtualenvs.in-project true --local

      - name: Cache Poetry virtual environment
        uses: actions/cache@v3
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies (with dev)
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Show Poetry environment info
        run: poetry env info

      - name: Clear any old migration cache and pycache
        run: |
          find . -path "*/migrations/*.pyc" -delete
          find . -path "*/migrations/__pycache__" -delete
          find . -name "__pycache__" -delete

      - name: Run migrations
        run: poetry run python manage.py migrate

      - name: Run tests
        run: poetry run pytest -v

      - name: Build Docker image without cache
        run: docker build --no-cache -t board:latest .

      - name: Login to Yandex Cloud Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON }}

      - name: Push Docker image to Yandex Container Registry
        run: |
          docker tag board:latest cr.yandex/$YC_REGISTRY_ID/board:latest
          docker push cr.yandex/$YC_REGISTRY_ID/board:latest

      - name: Deploy to Yandex Cloud VM
        uses: yc-actions/yc-coi-deploy@v2
        with:
          token: ${{ secrets.YC_TOKEN }}
          vm_id: ${{ secrets.YC_VM_ID }}
          container_image: cr.yandex/$YC_REGISTRY_ID/board:latest
