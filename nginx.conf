user  www-data;
worker_processes  auto;
pid  /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Логирование
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Настройка gzip для оптимизации
    gzip on;
    gzip_disable "msie6";

    # Настройки SSL, если потребуется, можно раскомментировать секции ssl изначально
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers on;

    upstream django_server {
        server unix:/run/gunicorn.sock fail_timeout=0;
    }

    server {
        listen 80;
        server_name your.domain.com;

        # Резерв для HTTP -> HTTPS редиректа (раскомментировать при SSL):
        # return 301 https://$host$request_uri;

        # Обработка статических файлов
        location /static/ {
            alias /srv/board/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, must-revalidate";
        }

        # Проксирование запросов к приложению
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://django_server;
        }

        # Лимит на размер тела запроса, регулируйте при необходимости
        client_max_body_size 10M;

        # Ошибки обработки
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
